name: coffey_ui
description: Shared Flutter package for Coffey Club Pickem — BLoCs, models, repositories, screens, widgets, and theme.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Models & serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Secure token storage (mobile) / plain storage (web — see token_storage.dart)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Google Sign-In
  google_sign_in: ^6.2.0
  # Web only — renders Google's own "Sign in with Google" button. On web,
  # `google_sign_in`'s imperative `signIn()` cannot return an ID token (GIS
  # policy restricts ID tokens to Google-rendered UI); see google_web_button.dart.
  google_sign_in_web: ^0.12.4

  # Typography
  google_fonts: ^6.2.1

  # File save/share (paper pick sheet PDF download) — share_plus for the
  # native share sheet on mobile; web triggers a browser download directly
  # via package:web instead of going through share_plus's web plugin (its
  # web platform registration wasn't taking effect in this environment).
  share_plus: ^11.0.0
  web: ^1.1.0

  # Firebase (push notifications)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
