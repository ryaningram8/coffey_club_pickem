name: coffey_web
description: Coffey Club Pickem — Web application entrypoint.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Shared package
  coffey_ui:
    path: ../../packages/coffey_ui

