events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Upstream API
  upstream api {
    server api:4000;
  }

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name coffeyclub-dev.saloosa.dev;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name coffeyclub-dev.saloosa.dev;

    ssl_certificate     /etc/letsencrypt/live/saloosa.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saloosa.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers. `always` so they're sent on error responses (4xx/5xx)
    # too, not just 2xx/3xx (nginx's add_header default). Not adding `preload`
    # to HSTS — that requires submitting to browsers' hardcoded preload list,
    # which is hard to reverse; skip unless deliberately opted into later.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # API proxy
    location /api/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Flutter web app (static files)
    location / {
      root /usr/share/nginx/html;
      index index.html;

      # Flutter web uses single-page app routing
      try_files $uri $uri/ /index.html;

      # Cache static assets aggressively; HTML never cached
      # (each nested location below defines its own add_header, which stops
      # inheritance of the server-level security headers above — nginx only
      # inherits add_header when the current block has none of its own — so
      # they're repeated explicitly here rather than silently dropped)
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
      }
      location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
      }
    }
  }
}
